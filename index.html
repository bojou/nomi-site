<style>
  :root {
    --ground: #E9E5D6; --ink: #14291E; --ink-strong: #1B3A2A; --muted: #5F7366; --rule: #C9C6B4; --dot: #B5622F;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #1E3126; --ink: #F4F2E7; --ink-strong: #F4F2E7; --muted: #A9BFAF; --rule: #3F5848; --dot: #E5B98A; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }
  body { margin: 0; min-height: 100%; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.55; display: grid; place-items: center; }
  main { padding-inline: 24px; padding-block: 48px; max-width: 34rem; display: grid; gap: 18px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(64px, 18vw, 96px); line-height: 0.9; margin: 0; color: var(--ink-strong); letter-spacing: -0.02em; }
  .mark { display: block; height: clamp(56px, 16vw, 84px); width: auto; color: var(--ink-strong); }
  .mark .dot { fill: var(--dot); }
  p { margin: 0; }
  .lead { font-size: 20px; }
  .en { color: var(--muted); }
  nav { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 15px; }
  a { color: var(--ink-strong); }
</style>
