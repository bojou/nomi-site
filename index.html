<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Nomi, familjeplaneraren för hela hushållet. The family planner for your household.">
<title>Nomi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap">
<style>
  :root {
    --ground: #E9E5D6; --ink: #14291E; --ink-strong: #1B3A2A; --muted: #5F7366; --rule: #C9C6B4; --dot: #B5622F;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #1E3126; --ink: #F4F2E7; --ink-strong: #F4F2E7; --muted: #A9BFAF; --rule: #3F5848; --dot: #E5B98A; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }
  body { margin: 0; min-height: 100%; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.55; display: grid; place-items: center; }
  main { padding-inline: 24px; padding-block: 48px; max-width: 34rem; display: grid; gap: 18px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(64px, 18vw, 96px); line-height: 0.9; margin: 0; color: var(--ink-strong); letter-spacing: -0.02em; }
  h1 span { color: var(--dot); }
  p { margin: 0; }
  .lead { font-size: 20px; }
  .en { color: var(--muted); }
  nav { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 15px; }
  a { color: var(--ink-strong); }
</style>
</head>
<body>
<main>
  <h1>nomi<span>.</span></h1>
  <p class="lead">Familjeplaneraren för hela hushållet. Skriv som du pratar, så ser alla i familjen det som gäller.</p>
  <p class="en" lang="en">The family planner for your whole household.</p>
  <nav>
    <a href="/privacy/">Integritetspolicy · Privacy</a>
    <span>support@nomi.house</span>
  </nav>
</main>
</body>
</html>
